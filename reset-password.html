<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CallMagnet</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0E1419;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:#111c2d;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:40px;width:100%;max-width:420px}
    .logo{color:#10b981;font-size:13px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:24px}
    .back{color:#10b981;font-size:13px;text-decoration:none;display:inline-block;margin-bottom:20px}
    h1{font-size:26px;font-weight:700;margin-bottom:8px}
    .sub{color:#8892a4;font-size:14px;margin-bottom:28px}
    label{display:block;font-size:11px;font-weight:700;letter-spacing:0.1em;color:#8892a4;margin-bottom:8px;margin-top:16px}
    input{width:100%;background:#0E1419;border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#fff;font-size:15px;padding:12px 14px;outline:none;font-family:inherit}
    input:focus{border-color:#10b981}
    .btn{width:100%;background:#10b981;border:none;border-radius:8px;color:#000;font-size:15px;font-weight:700;padding:14px;cursor:pointer;margin-top:24px;font-family:inherit}
    .btn:disabled{opacity:0.6;cursor:not-allowed}
    .err{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:8px;color:#f87171;font-size:13px;padding:10px 14px;margin-top:14px;display:none}
    .ok{background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);border-radius:8px;color:#10b981;font-size:13px;padding:10px 14px;margin-top:14px;display:none}
    #invalid{text-align:center;display:none}
    #invalid p{color:#8892a4;margin-bottom:16px;font-size:14px}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">★ &nbsp;CALLMAGNET</div>
  <div id="formSection">
    <a href="/" class="back">← Back to sign in</a>
    <h1>Update password.</h1>
    <p class="sub">Enter your new password below.</p>
    <label>NEW PASSWORD</label>
    <input type="password" id="pass1" placeholder="At least 6 characters" />
    <label>CONFIRM PASSWORD</label>
    <input type="password" id="pass2" placeholder="Repeat password" />
    <div class="err" id="errMsg"></div>
    <div class="ok" id="okMsg">Password updated. Redirecting to sign in...</div>
    <button class="btn" id="updateBtn" onclick="handleUpdate()">Update password and sign in</button>
  </div>
  <div id="invalid">
    <p>This link has expired or is invalid.</p>
    <a href="/" style="color:#10b981;font-size:14px">← Go to sign in</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = '%%SUPABASE_URL%%';
  const SUPABASE_ANON_KEY = '%%SUPABASE_ANON_KEY%%';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      storage: window.localStorage,
      storageKey: 'callmagnet-auth-token',
      autoRefreshToken: true,
      detectSessionInUrl: true,
    }
  });

  if (!window.location.hash.includes('type=recovery')) {
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('invalid').style.display = 'block';
  }

  async function handleUpdate() {
    const pass1 = document.getElementById('pass1').value;
    const pass2 = document.getElementById('pass2').value;
    const btn = document.getElementById('updateBtn');
    const errMsg = document.getElementById('errMsg');
    const okMsg = document.getElementById('okMsg');
    errMsg.style.display = 'none';
    okMsg.style.display = 'none';
    if (pass1.length < 6) {
      errMsg.textContent = 'Password must be at least 6 characters.';
      errMsg.style.display = 'block';
      return;
    }
    if (pass1 !== pass2) {
      errMsg.textContent = 'Passwords do not match.';
      errMsg.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Updating...';
    try {
      const { error } = await sb.auth.updateUser({ password: pass1 });
      if (error) {
        errMsg.textContent = error.message;
        errMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Update password and sign in';
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (session?.access_token) {
        await fetch(SUPABASE_URL + '/functions/v1/clear-must-change-password', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + session.access_token },
        }).catch(() => {});
      }
      okMsg.style.display = 'block';
      setTimeout(() => { window.location.href = '/'; }, 1500);
    } catch (e) {
      errMsg.textContent = 'Network error. Try again.';
      errMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Update password and sign in';
    }
  }
</script>
</body>
</html>
