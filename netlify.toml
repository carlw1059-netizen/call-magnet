# Netlify configuration for callmagnet.com.au

[build]
  command = "sed -i 's/\r//' assets/js/clients-admin.js assets/js/dashboard.js assets/js/middle-man-admin.js assets/js/middleman.js assets/js/onboard.js && sed -i 's|%%SUPABASE_URL%%|'\"$SUPABASE_URL\"'|g' assets/js/clients-admin.js assets/js/dashboard.js assets/js/middle-man-admin.js assets/js/middleman.js assets/js/onboard.js && sed -i 's|%%SUPABASE_ANON_KEY%%|'\"$SUPABASE_ANON_KEY\"'|g' assets/js/clients-admin.js assets/js/dashboard.js assets/js/middle-man-admin.js assets/js/middleman.js assets/js/onboard.js"

[[redirects]]
  from   = "/b/*"
  to     = "/b.html"
  status = 200

[[redirects]]
  from   = "/u/*"
  to     = "/u.html"
  status = 200

[[redirects]]
  from   = "https://cm1.au/*"
  to     = "https://callmagnet.com.au/b/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/b/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/assets/js/middleman.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/assets/css/middleman.css"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/assets/js/middle-man-admin.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/assets/css/middle-man-admin.css"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/ffmpeg"]
