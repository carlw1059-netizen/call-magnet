name: Deploy cm1site to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'cm1site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SPA copies
        run: |
          cp cm1site/b.html cm1site/index.html
          cp cm1site/b.html cm1site/404.html
          sed -i 's|https://callmagnet.com.au/assets/js/middleman.js|/assets/js/middleman.js|g' cm1site/index.html cm1site/404.html
          sed -i 's|https://callmagnet.com.au/assets/css/middleman.css[^"]*|/assets/css/middleman.css|g' cm1site/index.html cm1site/404.html

      - name: Inject credentials into middleman.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          sed -i "s|%%SUPABASE_URL%%|$SUPABASE_URL|g" cm1site/assets/js/middleman.js
          sed -i "s|%%SUPABASE_ANON_KEY%%|$SUPABASE_ANON_KEY|g" cm1site/assets/js/middleman.js

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cm1site --project-name=callmagnet-cm1
