<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clients — CallMagnet Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg?v=2026-05-14" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/clients-admin.css?v=20260615a">
</head>
<body>
<div id="caAuthGate">Checking access…</div>
<div id="caPage" style="display:none;">
  <header class="mma-header">
    <span class="mma-header-title">Client Management <span id="caCount"></span></span>
    <button id="caBackBtn" class="mma-back-btn" onclick="window.location.href='/'">← Dashboard</button>
    <div id="envBadge" style="display:inline-flex;align-items:center;gap:8px;margin-left:12px;"></div>
    <script>
    (function() {
      var isStaging = window.location.hostname.indexOf('staging') !== -1;
      var badge = document.getElementById('envBadge');
      var otherUrl = isStaging
        ? window.location.href.replace('callmagnet-staging.netlify.app', 'callmagnet.com.au')
        : window.location.href.replace('callmagnet.com.au', 'callmagnet-staging.netlify.app');
      badge.innerHTML =
        '<span style="background:' + (isStaging ? '#f59e0b' : '#10b981') + ';color:#000;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:0.06em;">' +
        (isStaging ? 'STAGING' : 'PRODUCTION') + '</span>' +
        '<a href="' + otherUrl + '" style="font-size:11px;color:#888;text-decoration:none;border:1px solid #ccc;padding:3px 8px;border-radius:4px;">' +
        (isStaging ? 'Go to Production →' : 'Go to Staging →') + '</a>';
    })();
    </script>
    <button onclick="window.location.href='/'" style="background:#1D4ED8;color:#fff;font-weight:700;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:14px;margin-left:8px;">← Back</button>
  </header>
  <div class="mma-body">
    <div class="ca-search-wrap" id="caSearchWrap"></div>
    <div class="ca-filter-bar">
      <button id="caShowCancelledBtn" onclick="toggleCancelled()" style="font-size:13px;padding:6px 14px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;">Show cancelled</button>
    </div>
    <div class="ca-grid" id="caGrid"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/clients-admin.js?v=20260622f"></script>
</body>
</html>
