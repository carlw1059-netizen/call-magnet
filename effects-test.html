<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallMagnet — Effects Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0E1419;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 24px;
  }
  @keyframes breathe {
    0%   { box-shadow: 0 0 4px var(--neon, #00D4FF), 0 0 6px color-mix(in srgb, var(--neon, #00D4FF) 30%, transparent); }
    50%  { box-shadow: 0 0 12px var(--neon, #00D4FF), 0 0 24px color-mix(in srgb, var(--neon, #00D4FF) 60%, transparent); }
    100% { box-shadow: 0 0 4px var(--neon, #00D4FF), 0 0 6px color-mix(in srgb, var(--neon, #00D4FF) 30%, transparent); }
  }
  @keyframes pulse-expand {
    0%, 100% { box-shadow: 0 0 4px var(--neon, #00D4FF), 0 0 6px color-mix(in srgb, var(--neon, #00D4FF) 30%, transparent); transform: scale(1); }
    50% { box-shadow: 0 0 20px var(--neon, #00D4FF), 0 0 40px color-mix(in srgb, var(--neon, #00D4FF) 60%, transparent); transform: scale(1.03); }
  }
  @keyframes double-pulse {
    0%, 100% { box-shadow: 0 0 4px var(--neon, #00D4FF); }
    15% { box-shadow: 0 0 16px var(--neon, #00D4FF), 0 0 30px color-mix(in srgb, var(--neon, #00D4FF) 60%, transparent); }
    30% { box-shadow: 0 0 4px var(--neon, #00D4FF); }
    45% { box-shadow: 0 0 16px var(--neon, #00D4FF), 0 0 30px color-mix(in srgb, var(--neon, #00D4FF) 60%, transparent); }
    60% { box-shadow: 0 0 4px var(--neon, #00D4FF); }
  }
  @keyframes strobe {
    0%, 100% { box-shadow: 0 0 4px var(--neon, #00D4FF); opacity: 1; }
    10% { box-shadow: 0 0 20px var(--neon, #00D4FF); opacity: 0.5; }
    20% { box-shadow: 0 0 4px var(--neon, #00D4FF); opacity: 1; }
    30% { box-shadow: 0 0 20px var(--neon, #00D4FF); opacity: 0.5; }
    40% { box-shadow: 0 0 4px var(--neon, #00D4FF); opacity: 1; }
  }
  @keyframes shimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes bounce {
    0%, 100% { transform: scale(1); }
    30% { transform: scale(0.93); }
    60% { transform: scale(1.06); }
    80% { transform: scale(0.98); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-5px); }
    30% { transform: translateX(5px); }
    45% { transform: translateX(-4px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    90% { transform: translateX(2px); }
  }
  @keyframes glitch {
    0%, 100% { transform: translate(0); filter: none; }
    20% { transform: translate(-3px, 1px); filter: hue-rotate(90deg); }
    40% { transform: translate(3px, -1px); filter: hue-rotate(180deg); }
    60% { transform: translate(-2px, 2px); filter: hue-rotate(270deg); }
    80% { transform: translate(2px, -2px); filter: none; }
  }
  @keyframes electric {
    0%, 100% { box-shadow: 0 0 4px var(--neon, #00D4FF); }
    10% { box-shadow: 0 0 14px var(--neon, #00D4FF), 2px 0 8px var(--neon, #00D4FF); }
    20% { box-shadow: 0 0 4px var(--neon, #00D4FF); }
    35% { box-shadow: -2px 0 12px var(--neon, #00D4FF), 0 0 20px var(--neon, #00D4FF); }
    50% { box-shadow: 0 0 4px var(--neon, #00D4FF); }
    65% { box-shadow: 0 2px 14px var(--neon, #00D4FF), 0 0 8px var(--neon, #00D4FF); }
    80% { box-shadow: 0 0 4px var(--neon, #00D4FF); }
    90% { box-shadow: 2px -2px 16px var(--neon, #00D4FF); }
  }
  @keyframes shockwave {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--neon, #00D4FF) 80%, transparent); }
    100% { box-shadow: 0 0 0 20px color-mix(in srgb, var(--neon, #00D4FF) 0%, transparent); }
  }
  @keyframes runner {
    0% { box-shadow: 8px 0 12px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
    25% { box-shadow: 0 8px 12px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
    50% { box-shadow: -8px 0 12px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
    75% { box-shadow: 0 -8px 12px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
    100% { box-shadow: 8px 0 12px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
  }
  @keyframes fill-sweep {
    0% { background: rgba(0,0,0,0.35); }
    50% { background: color-mix(in srgb, var(--neon, #00D4FF) 30%, rgba(0,0,0,0.35)); }
    100% { background: rgba(0,0,0,0.35); }
  }
  @keyframes aurora {
    0%, 100% { box-shadow: 0 0 8px #00D4FF, 0 0 16px #00D4FF; }
    33% { box-shadow: 0 0 8px #FF10F0, 0 0 16px #FF10F0; }
    66% { box-shadow: 0 0 8px #39FF14, 0 0 16px #39FF14; }
  }
  @keyframes spotlight {
    0%, 100% { box-shadow: 8px 0 20px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
    25% { box-shadow: 0 8px 20px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
    50% { box-shadow: -8px 0 20px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
    75% { box-shadow: 0 -8px 20px var(--neon, #00D4FF), 0 0 4px var(--neon, #00D4FF); }
  }
  @keyframes ripple {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--neon, #00D4FF) 70%, transparent), 0 0 4px var(--neon, #00D4FF); }
    100% { box-shadow: 0 0 0 16px color-mix(in srgb, var(--neon, #00D4FF) 0%, transparent), 0 0 4px var(--neon, #00D4FF); }
  }
  @keyframes ripple-expand {
    to { transform: scale(4); opacity: 0; }
  }
</style>
</head>
<body>
<h1 style="color:#10b981;font-size:16px;letter-spacing:0.1em;text-transform:uppercase;">CallMagnet — Effects Test</h1>

<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;">
  <select id="effectSelect" style="height:36px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:#1C2730;color:#fff;font-size:13px;padding:0 10px;cursor:pointer;">
    <option value="breathe">Breathing glow (base)</option>
    <option value="none">No effect</option>
    <option value="pulse-expand">Pulse expand</option>
    <option value="colour-shift">Colour shift</option>
    <option value="double-pulse">Double pulse</option>
    <option value="strobe">Strobe</option>
    <option value="corner-glow">Corner glow</option>
    <option value="border-wipe">Border wipe</option>
    <option value="electric">Electric</option>
    <option value="shimmer">Shimmer</option>
    <option value="aurora">Aurora</option>
    <option value="spotlight">Spotlight</option>
    <option value="bounce">Bounce</option>
    <option value="glitch">Glitch</option>
    <option value="shockwave">Shockwave</option>
    <option value="float">Float</option>
    <option value="runner">Runner</option>
    <option value="ripple">Ripple</option>
    <option value="shake">Shake</option>
    <option value="fill-sweep">Fill sweep</option>
  </select>

  <input id="colourPicker" type="color" value="#00D4FF" style="width:36px;height:36px;border:none;border-radius:8px;cursor:pointer;background:none;">
</div>
<div id="mockUnit" style="
  position: relative;
  width: 320px;
  --neon: #00D4FF;
">
  <button id="mockBtn" type="button" style="
    display: block;
    width: 100%;
    padding: 16px 24px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 2px solid var(--neon, #00D4FF);
    border-radius: 12px;
    color: var(--neon, #00D4FF);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    letter-spacing: 0.01em;
    animation: breathe 2.5s ease-in-out infinite;
  ">🍽️ Book a table</button>
</div>
<script>
  var btn = document.getElementById('mockBtn');
  var unit = document.getElementById('mockUnit');
  var select = document.getElementById('effectSelect');
  var picker = document.getElementById('colourPicker');

  var effectAnimations = {
    'breathe':      'breathe 2.5s ease-in-out infinite',
    'none':         'none',
    'pulse-expand': 'pulse-expand 2s ease-in-out infinite',
    'colour-shift': 'aurora 4s linear infinite',
    'double-pulse': 'double-pulse 2.5s ease-in-out infinite',
    'strobe':       'strobe 1.5s linear infinite',
    'corner-glow':  'spotlight 3s linear infinite',
    'border-wipe':  'runner 2s linear infinite',
    'electric':     'electric 1.8s linear infinite',
    'shimmer':      'shimmer 2s linear infinite',
    'aurora':       'aurora 4s linear infinite',
    'spotlight':    'spotlight 3s linear infinite',
    'bounce':       'bounce 0.6s ease-in-out infinite',
    'glitch':       'glitch 1.5s linear infinite',
    'shockwave':    'shockwave 1s ease-out infinite',
    'float':        'float 3s ease-in-out infinite',
    'runner':       'runner 2s linear infinite',
    'ripple':       'none',
    'shake':        'none',
    'fill-sweep':   'none',
  };

  function applyEffect() {
    var effect = select.value;
    var anim = effectAnimations[effect] || 'none';
    btn.style.animation = anim;
  }

  function applyColour() {
    var c = picker.value;
    unit.style.setProperty('--neon', c);
    btn.style.borderColor = c;
    btn.style.color = c;
  }

  select.addEventListener('change', applyEffect);
  picker.addEventListener('input', applyColour);

  applyEffect();
  applyColour();

  // ── Tap-triggered effects ─────────────────────────────────────────────
  btn.addEventListener('click', function(e) {
    var effect = select.value;

    // Ripple — circle expands from tap point
    if (effect === 'ripple') {
      var circle = document.createElement('span');
      circle.style.cssText = 'position:absolute;border-radius:50%;background:rgba(255,255,255,0.35);transform:scale(0);animation:ripple-expand 0.5s ease-out forwards;pointer-events:none;';
      var rect = btn.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      circle.style.width = circle.style.height = size + 'px';
      circle.style.left = (e.clientX - rect.left - size / 2) + 'px';
      circle.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
      btn.style.overflow = 'hidden';
      btn.appendChild(circle);
      setTimeout(function() { circle.remove(); }, 600);
    }

    // Shake — add class, remove after animation
    if (effect === 'shake') {
      btn.style.animation = 'shake 0.4s ease';
      setTimeout(function() {
        btn.style.animation = 'none';
      }, 400);
    }

    // Fill sweep — sweep colour across button
    if (effect === 'fill-sweep') {
      btn.style.background = 'linear-gradient(90deg, ' + picker.value + ' 50%, rgba(0,0,0,0.35) 50%)';
      btn.style.backgroundSize = '200% 100%';
      btn.style.backgroundPosition = '100% 0';
      btn.style.transition = 'background-position 0.4s ease';
      setTimeout(function() {
        btn.style.backgroundPosition = '0% 0';
        setTimeout(function() {
          btn.style.background = 'rgba(0,0,0,0.35)';
          btn.style.backgroundSize = '';
          btn.style.backgroundPosition = '';
          btn.style.transition = '';
        }, 500);
      }, 10);
    }
  });
</script>
</body>
</html>
