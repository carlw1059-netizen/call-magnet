<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E1419">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CallMagnet</title>
<script>
  /* Force the Progressier service worker to revalidate on every load.
     Without this, SW serves stale cached assets even after a hard refresh. */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(registrations) {
      for (var r of registrations) { r.update(); }
    });
  }
</script>
<link rel="stylesheet" href="https://callmagnet.com.au/assets/css/middleman.css?v=20260628a">
</head>
<body>
<div style="position:fixed;top:0;left:0;width:100%;height:12px;background:#0E1419;z-index:9999;pointer-events:none;"></div>
<div style="position:fixed;bottom:-8px;left:0;width:100%;min-height:12px;background:#0E1419;z-index:9999;pointer-events:none;"></div>

<!-- Full-screen background layers (z-index 0 and 1) -->
<div id="bgFixed"></div>
<div id="bgOverlay"></div>

<div id="app">

  <!-- Tap-outside catcher: transparent, z-index 5, shown when a form is open.
       Sits above the video/overlay (z-index 0–1) but below the open btn-unit
       (z-index 10). Clicking it calls closeForm(). -->
  <div id="tapCatcher"></div>

  <!-- Skeleton loading state -->
  <div id="skeleton">
    <div class="skel-header"></div>
    <div class="skel-spacer"></div>
    <div class="skel-buttons">
      <div class="skel-btn"></div>
      <div class="skel-btn"></div>
      <div class="skel-btn"></div>
      <div class="skel-btn"></div>
    </div>
  </div>

  <!-- Not-found state (hidden by default) -->
  <div id="stateNotFound" class="state-cover" style="display:none">
    <h2>This page isn't available</h2>
    <p>The link you followed may have expired or the business is no longer active.</p>
  </div>

  <!-- Main page (hidden until client loaded) -->
  <div id="mainPage">

    <!-- Text group — business name, promo text, section label — centred above buttons -->
    <div class="page-header" id="pageHeader">
      <div class="hero-business-name" id="heroBusinessName"></div>
    </div>

    <!-- Flexible spacer: expands to push buttons to lower screen when bg image present -->
    <div id="contentSpacer"></div>

    <!-- Buttons + forms -->
    <div class="content" id="content">
      <div class="buttons" id="buttonsWrap"></div>

      <!-- "See what's on" — injected if middle_man_show_whats_on = true -->
      <div id="whatsOnSection" style="display:none">
        <hr class="whats-on-divider">
        <button class="whats-on-btn" id="whatsOnBtn" type="button">See what's on ↓</button>
        <div class="whats-on-content" id="whatsOnContent">
          <div class="whats-on-inner" id="whatsOnInner"></div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-powered">Powered by <span class="star">★</span> CallMagnet</div>
      <a class="footer-stop" href="#" id="stopTextsLink">Stop these texts</a>
    </div>

  </div><!-- /mainPage -->

</div><!-- /app -->

<script src="https://callmagnet.com.au/assets/js/middleman.js?v=20260809a" defer></script>

<!-- Debug overlay — only active when URL contains ?debug=1 — no effect on normal page operation -->
<script>
(function () {
  if (!/[?&]debug=1/.test(window.location.search)) return;

  var s = {
    sw:      'checking…',
    jsVer:   '—',
    vidCreated: 'no',
    canplay: 'no',
    playCalled: 'no',
    playResult: '—',
    ctGt0:   'no'
  };

  var panel = document.createElement('div');
  panel.style.cssText = [
    'position:fixed', 'bottom:60px', 'left:8px', 'z-index:999999',
    'background:rgba(0,0,0,0.88)', 'color:#39FF14',
    'font:11px/1.6 monospace', 'padding:8px 10px', 'border-radius:6px',
    'max-width:290px', 'pointer-events:none', 'word-break:break-all'
  ].join(';');
  document.body.appendChild(panel);

  function upd() {
    panel.innerHTML =
      '<b>🔧 CM debug</b><br>' +
      'SW cache: '       + s.sw          + '<br>' +
      'JS ver: '         + s.jsVer       + '<br>' +
      'vid created: '    + s.vidCreated  + '<br>' +
      'canplay fired: '  + s.canplay     + '<br>' +
      'play() called: '  + s.playCalled  + '<br>' +
      'play() result: '  + s.playResult  + '<br>' +
      'currentTime&gt;0: ' + s.ctGt0;
  }
  upd();

  // ── Service worker cache names ────────────────────────────────────────────
  if ('caches' in window) {
    caches.keys().then(function (keys) {
      s.sw = keys.length ? keys.join(' | ') : 'no caches';
      upd();
    }).catch(function () { s.sw = 'caches API error'; upd(); });
  } else {
    s.sw = 'not supported';
    upd();
  }

  // ── JS version from script tag src ───────────────────────────────────────
  var scriptEl = document.querySelector('script[src*="middleman.js"]');
  if (scriptEl) {
    var m = scriptEl.src.match(/[?&]v=([^&]+)/);
    s.jsVer = m ? m[1] : '(no ?v= param)';
  }
  upd();

  // ── Watch #bgFixed for a <video> element ─────────────────────────────────
  var bgFixed = document.getElementById('bgFixed');
  if (!bgFixed) { s.vidCreated = 'bgFixed missing'; upd(); return; }

  var obs = new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      for (var j = 0; j < mutations[i].addedNodes.length; j++) {
        var node = mutations[i].addedNodes[j];
        if (node.nodeName === 'VIDEO') {
          s.vidCreated = 'YES';
          upd();
          obs.disconnect();
          hookVideo(node);
          return;
        }
      }
    }
  });
  obs.observe(bgFixed, { childList: true });

  function hookVideo(vid) {
    // Passive canplay listener — no interference with middleman.js listener
    vid.addEventListener('canplay', function () {
      s.canplay = 'YES';
      upd();
    });

    // Intercept play() to observe call and result
    var origPlay = vid.play.bind(vid);
    vid.play = function () {
      s.playCalled = 'YES';
      upd();
      var promise = origPlay();
      if (promise && typeof promise.then === 'function') {
        promise.then(function () {
          s.playResult = 'SUCCESS';
          upd();
        }).catch(function (err) {
          s.playResult = 'ERR: ' + (err && err.name ? err.name : String(err));
          upd();
        });
      } else {
        s.playResult = 'called (no promise returned)';
        upd();
      }
      return promise;
    };

    // Poll currentTime every second
    setInterval(function () {
      s.ctGt0 = vid.currentTime > 0
        ? 'YES (' + vid.currentTime.toFixed(1) + 's)'
        : 'no (ct=' + vid.currentTime.toFixed(3) + ')';
      upd();
    }, 1000);
  }
})();
</script>
</body>
</html>
